name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lwo-proxy
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  package:
    name: OpenWrt package (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: rust
    # Skip the ~2h SDK build on plain pushes to main (releases build via
    # publish.yml on a tag). Still runs on pull requests and manual dispatch.
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        arch:
          # Target: Google Wifi AC-1304 (Cortex-A7 + NEON/VFPv4)
          - arm_cortex-a7_neon-vfpv4
    steps:
      - uses: actions/checkout@v5

      # Building rust/host (the Rust compiler) from source needs ~10-15 GB;
      # reclaim space a stock runner doesn't have free.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Build packages with the OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          FEEDNAME: lwo
          PACKAGES: lwo-proxy luci-app-mullvad-lwo
          # The SDK builds rust/host as a build-dep of lwo-proxy.
          NO_REFRESH_CHECK: 1

      - name: Collect our packages only
        run: |
          mkdir -p artifacts
          # Only our two packages, not the whole SDK package set.
          find bin/ \( -name 'lwo-proxy[-_]*' -o -name 'luci-app-mullvad-lwo[-_]*' \) \
            \( -name '*.apk' -o -name '*.ipk' \) -exec cp -v {} artifacts/ \;
          ls -l artifacts/

      - uses: actions/upload-artifact@v5
        with:
          name: packages-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: warn
